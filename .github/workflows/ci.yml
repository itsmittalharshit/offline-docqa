name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test-and-evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-lock.txt

      - name: Install CPU-only PyTorch
        run: pip install "$(grep '^torch==' requirements-lock.txt)" --index-url https://download.pytorch.org/whl/cpu

      - name: Install dependencies
        run: |
          pip install -r requirements-lock.txt
          python -m spacy download en_core_web_sm

      - name: Unit and API tests
        run: python -m pytest -q

      - name: Cache source PDFs
        id: pdf-cache
        uses: actions/cache@v4
        with:
          path: data/raw
          key: pdfs-${{ hashFiles('data_sources.json') }}

      - name: Fetch source PDFs from the private data repo
        if: steps.pdf-cache.outputs.cache-hit != 'true'
        env:
          GH_TOKEN: ${{ secrets.DATA_TOKEN }}
        run: |
          mkdir -p data/raw
          gh release download v1 --repo itsmittalharshit/offline-docqa-data --dir data/raw

      - name: Verify source PDF checksums
        run: python src/download_data.py --verify-only

      - name: Cache embedding model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-e5-small-v1

      - name: Download source PDFs
        run: python src/download_data.py

      - name: Build index
        run: |
          python src/chunk.py
          python src/embed.py
          python src/bm25.py

      - name: Check eval labels
        run: python src/check_eval.py

      - name: Retrieval quality gate
        run: python src/evaluate.py --mode hybrid --min-recall10 0.95 --min-mrr 0.68